#* Directories
model_name: baseline_RV_RS85_RS10k
mode: subset_test     # options: 'train', 'test', 'concat_train', 'subset_test'

data_dir: null

data_concat_train_dir: null

test_subset_dir: 
  - dataset/realsnow_video
  - dataset/RealSnow10k_pairs
  - dataset/Realsnow85

#* Train
batch_size: 2
learning_rate: 0.0002
weight_decay: 0
num_epoch: 300
print_freq: 100
num_worker: 4
save_freq: 1
valid_freq: 1
resume: null
patience: 50  # Increased patience for early stopping
version: small

#* Test
test_model: ckpt/snow100k-small.pkl
save_image: true
number_subsets: 10  # number of subsets for random sampling of the test set
subset_ratio: 0.1  # ratio of images to sample for each subset

#* Logging
model_save_dir: baseline_RV_RS85_RS10k/ConvIR/train/
result_dir: baseline_RV_RS85_RS10k/test 

notes: |
  testing baseline on realsnow_video, RealSnow10k_pairs and Realsnow85