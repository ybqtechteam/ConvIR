#* Directories
model_name: small_version_fixed_input_aug
mode: train     # options: 'train', 'test', 'concat_train', 'subset_test'

data_dir: dataset/RealRain-1k/RealRain-1k-L

data_concat_train_dir: null

test_subset_dir: null

#* Train
batch_size: 2
learning_rate: 0.0001
weight_decay: 0
num_epoch: 300
print_freq: 100
num_worker: 4
save_freq: 1
valid_freq: 1
resume: null
gamma: 0.5
patience: 50  # Increased patience for early stopping
num_res: 4  # Number of residual blocks in the model

#* Test
test_model: RESULTS/small_version_fixed_input_aug/realrain/ConvIR/train_results/Best.pkl
save_image: true
number_subsets: null
subset_ratio: null

#* Logging
model_save_dir: results/ConvIR/train/
result_dir: results/small_version_fixed_input_aug/test 

notes: |
  small version trained on RealRain-1k with fixed input size (640, 480)
